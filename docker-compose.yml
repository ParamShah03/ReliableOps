services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: reliableops
      POSTGRES_USER: reliableops
      POSTGRES_PASSWORD: reliableops
    ports:
      - "5432:5432"
    volumes:
      - reliableops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reliableops -d reliableops"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./app:/app/app

  worker:
    build: .
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=INFO --concurrency=2
    volumes:
      - ./app:/app/app

volumes:
  reliableops_pgdata:
